<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Showcase</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Our Products</h1>
  </header>

  <main class="product-grid">
    <!-- Example product card -->
    <div class="card">
      <img src="https://m.media-amazon.com/images/I/511qNzoRqXL._AC_SL1185_.jpg" alt="Product 1">
      <h2>Wig Making, Learning & Teaching Set</h2>
      <p class="price">R449.99</p>
      <button class="add to cart">Add to Cart</button>
    </div>

    <!-- Duplicate the card 5 more times for 6 products -->
    <div class="card">
      <img src="https://m.media-amazon.com/images/I/81RFlRzOQhL._AC_SX522_.jpg" alt="Product 2">
      <h2>LEDIZE Ponytail Extension</h2>
      <p class="price">R299.99</p>
      <button class="add to cart">Add to Cart</button>
    </div>

    <!-- Add 4 more cards here -->
  </main>
</body>
</html>
